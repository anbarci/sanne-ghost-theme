services:
  radar:
    build: .
    # Sadece bu makineden erişilir. Uzaktan erişim için önüne HTTPS ters vekil (Caddy vb.) koyun.
    ports:
      - "127.0.0.1:3120:3120"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./runtime:/app/runtime
    restart: unless-stopped
